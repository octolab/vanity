version: 2

updates:
  # / covers .github/workflows, not local actions
  - package-ecosystem: github-actions
    directories: [ '/', '/.github/actions/*' ]
    schedule:
      interval: daily
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: improvement'
      - 'scope: inventory'
      - 'scope: deps'
    commit-message:
      prefix: 'ci/cd'
      include: 'scope'
    open-pull-requests-limit: 30

  # the catalog page in docs/; the catalog itself has no npm dependencies
  - package-ecosystem: npm
    directory: /docs/
    schedule:
      interval: daily
      time: '05:00'
      timezone: UTC
    labels:
      - 'type: improvement'
      - 'scope: docs'
      - 'scope: deps'
    commit-message:
      prefix: 'docs'
      include: 'scope'
    open-pull-requests-limit: 30

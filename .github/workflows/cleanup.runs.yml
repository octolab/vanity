name: Workflow runs cleanup

on:
  schedule:
    - cron: 0 6 2 * * # at 06:00 on day-of-month 2, UTC, a day after the monthly delivery

  workflow_dispatch:
    inputs:
      pattern:
        description: Delete completed runs of this workflow, or All workflows.
        type: choice
        options:
          - All
          - Continuous delivery
          - Continuous integration
          - Workflow runs cleanup
        default: Workflow runs cleanup
        required: true
      dry_run:
        description: Only log actions, do not perform any delete operations.
        type: boolean
        required: false
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete:
    name: Deleting
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # empty, on the schedule or for All, means every workflow
          delete_workflow_pattern: >-
            ${{
              inputs.pattern != 'All'
              && inputs.pattern
              || ''
            }}
          dry_run: ${{ inputs.dry_run && 'true' || 'false' }}
          retain_days: 0
          keep_minimum_runs: 0

  # inline, not a local action: this job holds the Slack webhook
  notify:
    name: Notifying
    needs: [ delete ]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Define notification message
        id: message
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          message="${DISPATCH_REASON:-regular healthcheck}"
          printf 'txt=%s\n' "${message%%$'\n'*}" >> "${GITHUB_OUTPUT}"
      - name: Send Slack notification
        if: ${{ env.SLACK_WEBHOOK != '' }}
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2.4.1
        env:
          SLACK_COLOR: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          SLACK_FOOTER: made with ❤️ for everyone by <https://www.octolab.org/|OctoLab>
          SLACK_ICON: https://cdn.octolab.org/geek/octolab.png
          SLACK_MESSAGE: ${{ steps.message.outputs.txt }}
          SLACK_TITLE: '🧹 ${{ github.repository }}: ${{ github.workflow }}'
          SLACK_USERNAME: Notifier

name: Continuous delivery

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cd.urls.yml'
      - 'bin/lib/**/*.bash'
      - 'bin/verify.py'
      - '.gitmodules'
      - 'src/**/*'
      - 'go.work'
      - 'Makefile'
      - 'Taskfile'

  schedule:
    - cron: 0 7 1 * * # at 07:00 on day-of-month 1, UTC

  workflow_dispatch:
    inputs:
      reason:
        description: The reason for dispatching it manually.
        type: string
        default: manual healthcheck
        required: true

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Building
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check submodule credentials
        env:
          SUBMODULE_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo '::error::DEPENDABOT_TOKEN must have read access to the private repositories in .gitmodules.'
            exit 1
          fi
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.DEPENDABOT_TOKEN }}
          persist-credentials: false
      - name: Install dependencies
        env:
          MAINTAINER_VERSION: 0.1.0-rc11
        run: |
          release="https://github.com/octomation/maintainer/releases/download/v${MAINTAINER_VERSION}"
          archive="maintainer_${MAINTAINER_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/maintainer"
          cd "$RUNNER_TEMP/maintainer"
          curl --fail --show-error --location --retry 3 "$release/$archive" -o "$archive"
          curl --fail --show-error --location --retry 3 "$release/checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" maintainer
          echo "$RUNNER_TEMP/maintainer" >> "$GITHUB_PATH"
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6.0.0
        id: pages
      - name: Check the custom domain
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          if [ "$PAGES_HOST" != go.octolab.org ]; then
            echo '::error::Set go.octolab.org as the custom domain in Settings > Pages before deploying.'
            exit 1
          fi
      - name: Set up Go environment
        uses: actions/setup-go@v7.0.0
        with: { go-version-file: go.work, cache: false }

      - name: Build static HTML
        run: make
        env:
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
      - name: Upload the documentation
        uses: actions/upload-pages-artifact@v5.0.0
        with: { path: dist }

  deploy:
    name: Deploying
    needs: [ build ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write

    steps:
      - name: Deploy it to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  notify:
    name: Notifying
    needs: [ build, deploy ]
    runs-on: ubuntu-latest
    if: failure() || success()

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }

      - name: Send notification
        uses: ./.github/actions/notify
        continue-on-error: true
        with:
          emoji: 🤴
          channel: ${{ secrets.SLACK_WEBHOOK }}
          success: ${{ ! contains(needs.*.result, 'failure') }}

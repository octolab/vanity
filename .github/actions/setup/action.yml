name: Set up the build tools
description: >-
  Installs the exact Python and the Maintainer release that render
  go.octolab.org, checking the Maintainer archive against its release
  checksums. Do not use it before the deploy gate has passed: it is a file of
  the candidate tree.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with: { python-version: 3.15.2 }
    - name: Install Maintainer
      env:
        # the renderer of the published pages; a bump goes behind a byte-for-byte
        # comparison of dist/ with the previous build
        MAINTAINER_VERSION: 0.1.0-rc11
      run: |
        release="https://github.com/octomation/maintainer/releases/download/v${MAINTAINER_VERSION}"
        archive="maintainer_${MAINTAINER_VERSION}_linux-amd64.tar.gz"
        mkdir -p "${RUNNER_TEMP}/maintainer"
        cd "${RUNNER_TEMP}/maintainer"
        curl --fail --show-error --location --retry 3 "${release}/${archive}" -o "${archive}"
        curl --fail --show-error --location --retry 3 "${release}/checksums.txt" -o checksums.txt
        grep -F "  ${archive}" checksums.txt | sha256sum --check --strict
        tar -xzf "${archive}" maintainer
        echo "${RUNNER_TEMP}/maintainer" >> "${GITHUB_PATH}"
      shell: bash
